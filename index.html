<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नैतिक रावंधे की असली एआई</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e293b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
        }
        #chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #chat-box {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #334155;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .message {
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .user-msg {
            color: #38bdf8;
        }
        .ai-msg {
            color: #4ade80;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <h1>नैतिक रावंधे की असली एआई 🤖</h1>
    <div id="chat-container">
        <div id="chat-box">
            <div class="message ai-msg">नमस्ते नैतिक! मैं आपकी असली एआई हूँ। अब आप मुझसे पढ़ाई, इतिहास या किसी भी चीज़ के बारे में पूछ सकते हैं!</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="यहाँ अपना सवाल लिखिए या बोलें..." />
            <button onclick="sendMessage()">भेजें</button>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6I4Uadn_T5GX3EnAlanqMJjKGk_Xjd2I_O0PkSYDlDR7A"; // आपकी नई API Key
        
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value.trim();

            if (!userText) return;

            // यूजर का संदेश जोड़ें
            chatBox.innerHTML += `<div class="message user-msg"><b>आप:</b> ${userText}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // लोडिंग मैसेज
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message ai-msg" id="${loadingId}"><b>एआई:</b> सोच रहा हूँ...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                const res = await fetch(response, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userText }] }]
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="message ai-msg"><b>एआई:</b> ${aiReply}</div>`;

                    chatBox.innerHTML += `<div class="message ai-msg" style="color: #ef4444;"><b>एआई:</b> माफ़ी चाहता हूँ, कुछ गड़बड़ हो गई है। कृपया अपनी API Key जांचें।</div>`;
