<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नैतिक रावंधे की असली एआई</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #1e293b;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
    }
    .chat-header {
      background-color: #0f172a;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #334155;
    }
    .chat-container {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .bot-message {
      background-color: #334155;
      align-self: flex-start;
    }
    .user-message {
      background-color: #2563eb;
      align-self: flex-end;
    }
    .chat-input-area {
      display: flex;
      padding: 12px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
    }
    .chat-input-area input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      outline: none;
      background-color: #1e293b;
      color: #ffffff;
      font-size: 15px;
    }
    .chat-input-area button {
      margin-left: 10px;
      padding: 12px 22px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }
    .chat-input-area button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="chat-header">
    🤖 नैतिक रावंधे की असली एआई
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message bot-message">
      नमस्ते नैतिक रावंधे! मैं आपकी असली एआई हूँ। अब आप मुझसे पढ़ाई, इतिहास या किसी भी चीज़ के बारे में पूछ सकते हैं!
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="यहाँ अपना सवाल लिखिए..." onkeydown="handleKeyPress(event)">
    <button onclick="sendMessage()">भेजें</button>
  </div>

  <script>
    // आपकी सेट की गई Gemini API Key
    const API_KEY = "AQ.Ab8RN6I4Uadn_T5GX3EnAlanqMJjKGk_Xjd2I_O0PkSYDlDR7A";

    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const chatContainer = document.getElementById('chatContainer');
      const messageText = inputField.value.trim();

      if (messageText === "") return;

      // 1. यूजर का मैसेज स्क्रीन पर जोड़ें
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'message user-message';
      userMsgDiv.textContent = messageText;
      chatContainer.appendChild(userMsgDiv);

      inputField.value = "";
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // 2. लोडिंग मैसेज दिखाएं
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'message bot-message';
      botMsgDiv.textContent = "सोच रहा हूँ...";
      chatContainer.appendChild(botMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // 3. गूगल जेमिनी API को सुरक्षित फेच रिक्वेस्ट भेजना (gemini-1.5-flash मॉडल के साथ)
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: messageText }]
            }]
          })
        });

        const data = await response.json();
        
        // 4. जवाब चेक करके स्क्रीन पर दिखाना
        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          botMsgDiv.textContent = data.candidates[0].content.parts[0].text;
        } else if (data.error) {
          botMsgDiv.textContent = "एरर: " + data.error.message;
        } else {
          botMsgDiv.textContent = "माफ़ कीजिए, सर्वर से सही जवाब नहीं मिल पाया।";
        }
      } catch (error) {
        botMsgDiv.textContent = "कनेक्शन में दिक्कत आ रही है। कृपया इंटरनेट कनेक्शन जांचें।";
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }
  </script>

</body>
</html>
