<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme 3D Car Simulator - Naitik Rawandhe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,204,0.7);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
        }
        #speedometer {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ff0055;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,0,85,0.7);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #ff0055;
        }
        #instructions {
            position: absolute;
            bottom: 110px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
        }
        /* एक्सट्रीम कंट्रोल्स लेआउट */
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .control-group {
            display: flex;
            gap: 12px;
        }
        .game-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border: 2px solid #38bdf8;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 25px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
            transition: all 0.1s ease;
        }
        .game-btn:active {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>
    <div id="hud">स्कोर: <span id="score">0</span></div>
    <div id="speedometer">स्पीड: <span id="speed">120</span> किमी/घंटा</div>
    <div id="instructions">कंट్రోल्स: कीबोर्ड की **Arrow Keys** या नीचे दिए गए बटनों का उपयोग करें!</div>

    <!-- स्क्रीन पर मिलने वाले एक्सट्रीम कंट्रोल बटन्स -->
    <div class="controls-container">
        <div class="control-group">
            <button class="game-btn" ontouchstart="moveLeft()" onclick="moveLeft()">◀ बायां</button>
            <button class="game-btn" ontouchstart="moveRight()" onclick="moveRight()">दायां ▶</button>
        </div>
        <div class="control-group">
            <button class="game-btn" ontouchstart="speedUp()" onclick="speedUp()">⚡ एक्सटर्बो</button>
            <button class="game-btn" ontouchstart="slowDown()" onclick="slowDown()">🛑 ब्रेक</button>
        </div>
    </div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
