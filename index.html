<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Game - Naitik Rawandhe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="ui">स्कोर: <span id="score">0</span></div>
    <div id="instructions">कंट्रोल्स: गाड़ी को बाएं-दाएं ले जाने के लिए **Arrow Keys** (बाएं/दाएं तीर) का इस्तेमाल करें!</div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, car, road;
        let score = 0;
        let obstacles = [];
        let gameActive = true;
        let carSpeed = 0.1;

        function init() {
            // 1. सीन और कैमरा बनाना
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122); // रात का आसमान जैसा लुक

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            // 2. रेंडरर सेट करना
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 3. लाइट जोड़ना
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(0, 10, 5);
            scene.add(pointLight);

            // 4. 3D रोड बनाना
            const roadGeo = new THREE.PlaneGeometry(10, 200);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -50;
            scene.add(road);

            // 5. 3D कार बनाना (खिलाड़ी)
            const carGroup = new THREE.Group();
            
            // कार की बॉडी
            const bodyGeo = new THREE.BoxGeometry(1.5, 0.6, 3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 }); // लाल रंग की कार
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.3;
            carGroup.add(body);

            // कार की छत
            const roofGeo = new THREE.BoxGeometry(1.2, 0.5, 1.5);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 0.8, -0.2);
            carGroup.add(roof);

            car = carGroup;
            car.position.set(0, 0, 2);
            scene.add(car);

            // 6. कीबोर्ड कंट्रोल सुनना
            window.addEventListener('keydown', onKeyDown);

            // विंडो रिसाइज हैंडलर
            window.addEventListener('resize', onWindowResize);

            // गेम लूप शुरू करना
            animate();
        }

        function onKeyDown(event) {
            if (!gameActive) return;
            if (event.key === 'ArrowLeft' && car.position.x > -4) {
                car.position.x -= 0.8;
            }
            if (event.key === 'ArrowRight' && car.position.x < 4) {
                car.position.x += 0.8;
            }
        }

        function spawnObstacle() {
            if (!gameActive) return;
            const obsGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 }); // हरे रंग के रुकावट वाले डिब्बे
            const obstacle = new THREE.Mesh(obsGeo, obsMat);

            const randomX = (Math.random() - 0.5) * 8; // रोड के बीच रैंडम पोजीशन
            obstacle.position.set(randomX, 0.6, -80);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        // हर 1.5 सेकंड में नया रुकावट (Obstacle) पैदा करना
        setInterval(spawnObstacle, 1500);

        function animate() {
            if (!gameActive) return;

            requestAnimationFrame(animate);

            // रुकावटों को आगे बढ़ाना
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += 0.5;

                // कार और रुकावट के बीच टक्कर (Collision Detection) की जाँच
                if (Math.abs(car.position.x - obstacles[i].position.x) < 1.0 &&
                    Math.abs(car.position.z - obstacles[i].position.z) < 1.0) {
                    gameActive = false;
                    alert("गेम ओवर! आपका स्कोर: " + score);
                    location.reload();
                }

                // स्क्रीन से निकल जाने पर रुकावट को हटाना और स्कोर बढ़ाना
                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
