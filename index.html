<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme 3D Car Simulator - Naitik Rawandhe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,204,0.7);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #00ffcc;
        }
        #speedometer {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ff0055;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,0,85,0.7);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #ff0055;
        }
        #instructions {
            position: absolute;
            bottom: 110px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
        }
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .control-group {
            display: flex;
            gap: 12px;
        }
        .game-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border: 2px solid #38bdf8;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 25px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
            transition: all 0.1s ease;
        }
        .game-btn:active {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="hud">स्कोर: <span id="score">0</span></div>
    <div id="speedometer">स्पीड: <span id="speed">120</span> किमी/घंटा</div>
    <div id="instructions">कंट्रोल्स: कीबोर्ड की **Arrow Keys** या नीचे दिए गए बटनों का उपयोग करें!</div>

    <div class="controls-container">
        <div class="control-group">
            <button class="game-btn" ontouchstart="moveLeft()" onclick="moveLeft()">◀ बायां</button>
            <button class="game-btn" ontouchstart="moveRight()" onclick="moveRight()">दायां ▶</button>
        </div>
        <div class="control-group">
            <button class="game-btn" ontouchstart="speedUp()" onclick="speedUp()">⚡ टर्बो</button>
            <button class="game-btn" ontouchstart="slowDown()" onclick="slowDown()">🛑 ब्रेक</button>
        </div>
    </div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, car, road;
        let score = 0;
        let currentSpeed = 120;
        let obstacles = [];
        let gameActive = true;

        function init() {
            // 1. सीन और फिक्स कैमरा पोजीशन (ताकि कार साफ़ दिखे)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a16);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 12); // कैमरे को थोड़ा ऊपर और पीछे सेट किया गया है
            camera.lookAt(0, 0, 0);

            // 2. रेंडरर
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 3. तेज लाइटिंग ताकि कार और रोड साफ़ चमकें
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(0, 20, 10);
            scene.add(dirLight);

            // 4. रोड
            const roadGeo = new THREE.PlaneGeometry(12, 300);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1f1f2e });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            scene.add(road);

            // 5. बड़ी और साफ़ दिखने वाली 3D कार
            const carGroup = new THREE.Group();
            
            // कार की मुख्य बॉडी (चमकीली नीली)
            const bodyGeo = new THREE.BoxGeometry(2.0, 0.8, 4.0);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, metalness: 0.9, roughness: 0.1 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            carGroup.add(body);

            // कार की छत (Cabin)
            const roofGeo = new THREE.BoxGeometry(1.4, 0.6, 2.0);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.5 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 1.1, -0.2);
            carGroup.add(roof);

            // हेडलाइट्स (आगे की चमकती लाइटें)
            const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.7, 0.5, 2.05);
            carGroup.add(leftLight);

            const rightLight = new THREE.Mesh(lightGeo, lightMat);
            rightLight.position.set(0.7, 0.5, 2.05);
            carGroup.add(rightLight);

            car = carGroup;
            car.position.set(0, 0, 2); // कार को स्क्रीन के बिल्कुल सामने रखा गया है
            scene.add(car);

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function moveLeft() {
            if (gameActive && car.position.x > -4.5) {
                car.position.x -= 1.0;
            }
        }

        function moveRight() {
            if (gameActive && car.position.x < 4.5) {
                car.position.x += 1.0;
            }
        }

        function speedUp() {
            if (currentSpeed < 220) currentSpeed += 20;
            document.getElementById('speed').textContent = currentSpeed;
        }

        function slowDown() {
            if (currentSpeed > 60) currentSpeed -= 20;
            document.getElementById('speed').textContent = currentSpeed;
        }

        function onKeyDown(event) {
            if (event.key === 'ArrowLeft') moveLeft();
            else if (event.key === 'ArrowRight') moveRight();
            else if (event.key === 'ArrowUp') speedUp();
            else if (event.key === 'ArrowDown') slowDown();
        }

        function spawnTraffic() {
            if (!gameActive) return;
            const tGeo = new THREE.BoxGeometry(1.8, 1.0, 3.5);
            const tMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.7 });
            const obstacle = new THREE.Mesh(tGeo, tMat);

            const lanes = [-3.5, -1.2, 1.2, 3.5];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            
            obstacle.position.set(randomLane, 0.5, -120);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        setInterval(spawnTraffic, 1400);

        function animate() {
            if (!gameActive) return;

            requestAnimationFrame(animate);

            let moveSpeedFactor = currentSpeed / 200;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += 0.6 * moveSpeedFactor;

                // टक्कर की जाँच
                if (Math.abs(car.position.x - obstacles[i].position.x) < 1.3 &&
                    Math.abs(car.position.z - obstacles[i].position.z) < 2.0) {
                    gameActive = false;
                    alert("💥 क्रैश! गेम ओवर। आपका स्कोर: " + score);
                    location.reload();
                }

                if (obstacles[i].position.z > 6) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    score += 15;
                    document.getElementById('score').textContent = score;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
